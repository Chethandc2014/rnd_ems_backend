name: Pull Request Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/**'

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Check code coverage
        run: mvn jacoco:report
        continue-on-error: true

      - name: Comment PR with build status
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const buildStatus = '${{ job.status }}';
            const comment = `## Build Status\n**Status:** ${buildStatus}\n\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Add PR labels based on changes
        uses: actions/github-script@v6
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const labels = [];
            if (files.some(f => f.filename.startsWith('src/'))) labels.push('code');
            if (files.some(f => f.filename === 'pom.xml')) labels.push('dependencies');
            if (files.some(f => f.filename === 'Dockerfile')) labels.push('docker');
            if (files.some(f => f.filename.includes('.md'))) labels.push('documentation');
            
            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
