name: Docker Image CI

on:
  push:
    branches: [ "feature/rnd-ems-backend/cicd-integration" ]
  pull_request:
    branches: [ "feature/rnd-ems-backend/cicd-integration" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag rnd-ems-backend:$(date +%s)
